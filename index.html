<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

<body>
<div id="root" style="min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;padding:2rem 1.25rem;"></div>

<script>
// ── Color math ────────────────────────────────────────────────────────────────
function hsvToRgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1));};return[Math.round(f(5)*255),Math.round(f(3)*255),Math.round(f(1)*255)];}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d+6)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}return[h,mx===0?0:d/mx,mx];}
function rgbToHex(r,g,b){return"#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");}
function parseHex(raw){const c=raw.trim().replace(/^#/,"");if(!/^[0-9a-fA-F]{3}$|^[0-9a-fA-F]{6}$/.test(c))return null;return c.length===3?c.split("").map(x=>parseInt(x+x,16)):[0,2,4].map(i=>parseInt(c.slice(i,i+2),16));}
function lum(r,g,b){return 0.2126*(r/255)+0.7152*(g/255)+0.0722*(b/255);}
function blendH(h1,h2,t){let d=((h2-h1+540)%360)-180;return(h1+d*t+360)%360;}
function ink(l){return l>0.45?"rgba(0,0,0,0.72)":"rgba(255,255,255,0.88)";}

// ── Blackbody radiation (Tanner Helland approximation) ────────────────────────
// Returns normalised [r,g,b] 0-255 for a given colour temperature in Kelvin.
function kelvinToRgb(K){
  const t=Math.max(1000,Math.min(40000,K))/100;
  let r,g,b;
  // Red
  if(t<=66) r=255;
  else{ r=329.698727446*Math.pow(t-60,-0.1332047592); r=Math.max(0,Math.min(255,r)); }
  // Green
  if(t<=66){ g=99.4708025861*Math.log(t)-161.1195681661; }
  else      { g=288.1221695283*Math.pow(t-60,-0.0755148492); }
  g=Math.max(0,Math.min(255,g));
  // Blue
  if(t>=66)       b=255;
  else if(t<=19)  b=0;
  else{ b=138.5177312231*Math.log(t-10)-305.0447927307; b=Math.max(0,Math.min(255,b)); }
  return[Math.round(r),Math.round(g),Math.round(b)];
}

// Convert Kelvin to HSV hue (for blending with base colour)
function kelvinToHue(K){
  const[r,g,b]=kelvinToRgb(K);
  return rgbToHsv(r,g,b)[0];  // hue only
}

// Shadow hue: opposite temperature direction on the colour wheel
function shadowKelvinHue(K){
  // warm light (low K) → cool shadows, cool light (high K) → warm shadows
  const shadowK = K < 5500 ? Math.min(12000, K*2.2) : Math.max(1000, K*0.4);
  return kelvinToHue(shadowK);
}
function genPalette(H,S,V,K,lStr,sBias){
  const lH  = kelvinToHue(K);           // light source hue from Kelvin
  const sH  = shadowKelvinHue(K);       // shadow hue (complementary temperature)
  const k   = lStr*0.35;
  const mk=(dv,ds,dhf,ht,stopIdx)=>{
    const nV=Math.max(0.02,Math.min(1,V+dv));
    const naturalAdj = sBias < 0
      ? sBias * (stopIdx===0?0.4:stopIdx===1?0.25:stopIdx===3?0.1:stopIdx===4?0.15:0)
      : sBias * 0.28;
    const nS=Math.max(0,Math.min(1,S+ds+naturalAdj));
    const nH=blendH(H,ht,dhf);
    const[r,g,b]=hsvToRgb(nH,nS,nV);return{hex:rgbToHex(r,g,b),hsv:[nH,nS,nV],lum:lum(r,g,b)};
  };
  return[
    {label:"Highlight",   ...mk(0.28+k*0.3, -S*0.7,  0.35+k*0.2, lH, 0)},
    {label:"Light",       ...mk(0.14+k*0.1, -S*0.25, 0.18+k*0.1, lH, 1)},
    {label:"Midtone",     ...mk(0,0,0,H,                               2)},
    {label:"Shadow",      ...mk(-0.16-k*0.05,S*0.1,  0.20+k*0.1, sH, 3)},
    {label:"Deep Shadow", ...mk(-0.30-k*0.1,-S*0.15, 0.35+k*0.15,sH, 4)},
  ];
}

// ── Canvas ────────────────────────────────────────────────────────────────────
const RING_W=0.18;

// Triangle geometry — FIXED equilateral triangle (does not rotate with hue)
// v0 = right       (pure hue, S=1 V=1)  angle=0°
// v1 = upper-left  (white,    S=0 V=1)  angle=120°
// v2 = lower-left  (black,    S=0 V=0)  angle=240°
function triVertices(cx, cy, innerR){
  const r = innerR * 0.88;
  const angles = [0, 120, 240].map(d => d * Math.PI / 180);
  return angles.map(a => ({x: cx + r*Math.cos(a), y: cy + r*Math.sin(a)}));
}

// S,V from barycentric: v0=pure hue (S=1,V=1), v1=white (S=0,V=1), v2=black (S=0,V=0)
// Barycentric coordinates of point (px,py) in triangle (v0,v1,v2)
function bary(px,py,v0,v1,v2){
  const d=(v1.y-v2.y)*(v0.x-v2.x)+(v2.x-v1.x)*(v0.y-v2.y);
  const b0=((v1.y-v2.y)*(px-v2.x)+(v2.x-v1.x)*(py-v2.y))/d;
  const b1=((v2.y-v0.y)*(px-v2.x)+(v0.x-v2.x)*(py-v2.y))/d;
  const b2=1-b0-b1;
  return{b0,b1,b2};
}

// Is point inside triangle? (all barycentric >= 0)
function inTri(b){return b.b0>=-0.001&&b.b1>=-0.001&&b.b2>=-0.001;}

// v0=right/pure hue (S=1,V=1), v1=lower-left/black (S=0,V=0), v2=upper-left/white (S=0,V=1)
// Screen coords: y↓, so 120°=lower-left (black), 240°=upper-left (white)
function svFromBary(b){
  const v=b.b0+b.b2;                    // V = b0 + b2  (white at v2 contributes V)
  const s=v>0?b.b0/v:0;
  return{s:Math.max(0,Math.min(1,s)), v:Math.max(0,Math.min(1,v))};
}

// Pixel color: v0=pure hue, v1=black, v2=white
function triColor(b, H){
  const pure=hsvToRgb(H,1,1);
  const black=[0,0,0];
  const white=[255,255,255];
  return [0,1,2].map(c=>Math.round(
    Math.max(0,Math.min(255, b.b0*pure[c] + b.b1*black[c] + b.b2*white[c]))
  ));
}

function drawWheel(canvas,H,S,V,contours,bg){
  const ctx=canvas.getContext("2d"),W=canvas.width,cx=W/2,cy=W/2;
  // Three zones from outside in: valeur ring → gap → hue ring → triangle
  const outerR   = W/2-2;
  const vRingW   = outerR*0.20;  // valeur ring width
  const gapW     = 8;             // gap between the two rings (in canvas pixels)
  const hRingW   = outerR*0.20;  // hue ring width
  const vInnerR  = outerR - vRingW;            // inner edge of valeur ring
  const hOuterR  = vInnerR - gapW;             // outer edge of hue ring
  const innerR   = hOuterR - hRingW;           // triangle container radius
  const bgR=parseInt(bg.slice(1,3),16),bgG=parseInt(bg.slice(3,5),16),bgB=parseInt(bg.slice(5,7),16);
  const AA=1.2;
  ctx.clearRect(0,0,W,W);

  // Precompute valeur LUT: each degree → equal-luminance colour
  const L0=lum(...hsvToRgb(H,S,V));
  const vlut=new Uint8Array(361*3);
  for(let deg=0;deg<=360;deg++){
    let lo=0,hi=1;
    for(let i=0;i<22;i++){const m=(lo+hi)/2;const[r,g,b]=hsvToRgb(deg,m,V);if(lum(r,g,b)>L0)lo=m;else hi=m;}
    const[r,g,b]=hsvToRgb(deg,(lo+hi)/2,V);
    vlut[deg*3]=r;vlut[deg*3+1]=g;vlut[deg*3+2]=b;
  }

  const [v0,v1,v2]=triVertices(cx,cy,innerR);
  const img=ctx.createImageData(W,W);

  for(let y=0;y<W;y++){for(let x=0;x<W;x++){
    const dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy);
    const i=(y*W+x)*4;
    const angle=((Math.atan2(dy,dx)*180/Math.PI)+360+180)%360;
    const deg=Math.round(angle)%360;

    // ── Valeur ring (outermost) ──
    const vod=outerR-dist, vid=dist-vInnerR, ved=Math.min(vod,vid);
    if(ved>-AA && dist>=vInnerR-AA){
      const a=ved>AA?1:Math.max(0,Math.min(1,(ved+AA)/(2*AA)));
      const r=vlut[deg*3],g=vlut[deg*3+1],b=vlut[deg*3+2];
      img.data[i]=Math.round(r*a+bgR*(1-a));
      img.data[i+1]=Math.round(g*a+bgG*(1-a));
      img.data[i+2]=Math.round(b*a+bgB*(1-a));
      img.data[i+3]=255;
      continue;
    }

    // ── Hue ring (middle) ──
    const hod=hOuterR-dist, hid=dist-innerR, hed=Math.min(hod,hid);
    if(hed>-AA && dist>=innerR-AA){
      const a=hed>AA?1:Math.max(0,Math.min(1,(hed+AA)/(2*AA)));
      const[r,g,b]=hsvToRgb(angle,1,1);
      img.data[i]=Math.round(r*a+bgR*(1-a));
      img.data[i+1]=Math.round(g*a+bgG*(1-a));
      img.data[i+2]=Math.round(b*a+bgB*(1-a));
      img.data[i+3]=255;
      continue;
    }

    // ── Triangle SV (inner) ──
    if(dist<innerR){
      const b=bary(x,y,v0,v1,v2);
      if(inTri(b)){
        const [r,g,col]=triColor(b,H);
        img.data[i]=r;img.data[i+1]=g;img.data[i+2]=col;img.data[i+3]=255;
        if(contours && x<W-1){
          const bNext=bary(x+1,y,v0,v1,v2);
          if(inTri(bNext)){
            const l0=lum(r,g,col);
            const [r2,g2,b2]=triColor(bNext,H);
            const l1=lum(r2,g2,b2);
            for(const lv of[0.05,0.1,0.18,0.28,0.4,0.54,0.68,0.82])
              if((l0-lv)*(l1-lv)<0){
                img.data[i]=Math.round(r*0.12);img.data[i+1]=Math.round(g*0.12);img.data[i+2]=Math.round(col*0.12);
              }
          }
        }
      }
    }
  }}
  ctx.putImageData(img,0,0);

  // Ring separator line
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,vInnerR,0,Math.PI*2);
  ctx.strokeStyle="rgba(0,0,0,0.35)";ctx.lineWidth=1;ctx.stroke();
  // Triangle outline
  ctx.beginPath();ctx.moveTo(v0.x,v0.y);ctx.lineTo(v1.x,v1.y);ctx.lineTo(v2.x,v2.y);ctx.closePath();
  ctx.strokeStyle="rgba(255,255,255,0.12)";ctx.lineWidth=1;ctx.stroke();
  ctx.restore();
}

// Expose ring geometry so cursor & hit-test code can use the same values
function getRingGeom(){
  const outerR=PX/2-2;
  const vRingW=outerR*0.20, gapW=8, hRingW=outerR*0.20;
  const vInnerR=outerR-vRingW;
  const hOuterR=vInnerR-gapW;
  const innerR=hOuterR-hRingW;
  return{outerR, vInnerR, hOuterR, innerR};
}

// Cursor position: S,V → barycentric → pixel coords
// v0=pure hue (S=1,V=1), v1=white (S=0,V=1), v2=black (S=0,V=0)
function svToPixel(S, V, cx, cy, innerR){
  const [v0,v1,v2]=triVertices(cx,cy,innerR);
  // v1=black(b1=1-V), v2=white(b2=(1-S)*V), v0=pure(b0=S*V)
  const b0=S*V, b1=1-V, b2=(1-S)*V;
  return{
    x: b0*v0.x + b1*v1.x + b2*v2.x,
    y: b0*v0.y + b1*v1.y + b2*v2.y,
  };
}

function drawValeurBar(H,S,V){
  const L=lum(...hsvToRgb(H,S,V));
  const stops=[];
  for(let hh=0;hh<=360;hh+=3){
    let lo=0,hi=1;
    for(let i=0;i<22;i++){const m=(lo+hi)/2;const[r,g,b]=hsvToRgb(hh,m,V);if(lum(r,g,b)>L)lo=m;else hi=m;}
    const[r,g,b]=hsvToRgb(hh,(lo+hi)/2,V);
    stops.push(`rgb(${r},${g},${b})`);
  }
  document.getElementById("barGrad").style.background=`linear-gradient(to right,${stops.join(",")})`;
}

// ── State ─────────────────────────────────────────────────────────────────────
let H=28,S=0.72,V=0.78,contours=false,lightK=5500,lightStr=0.5,satBias=0,refHsv=null;
let copyTimer=null,copyRefTimer=null,pasteTimer=null;
const palTimers={};
const SURFACE="#252422";
function getWheelBg(){return SURFACE;}
const DPR=Math.min(window.devicePixelRatio||1,3);
const CSS=300,PX=CSS*DPR;

// ── Build DOM ─────────────────────────────────────────────────────────────────
const root=document.getElementById("root");
root.innerHTML=`
<div style="width:100%;max-width:420px;margin-bottom:18px;display:flex;align-items:flex-start;justify-content:space-between;">
  <div>
    <div style="font-size:19px;letter-spacing:.04em;">Valeur</div>
    <div class="lbl" style="margin-top:3px;">Equal Value Color Picker</div>
  </div>

</div>

<div style="width:100%;max-width:420px;margin-bottom:14px;position:relative;">
  <div id="hexWrap" style="display:flex;height:42px;border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden;background:#2e2c29;transition:border-color .2s;">
    <div style="padding:0 14px;display:flex;align-items:center;font-size:16px;color:#6b6863;border-right:1px solid rgba(255,255,255,.08);flex-shrink:0;">#</div>
    <input type="text" id="hexInput" maxlength="6" placeholder="hex code" style="flex:1;min-width:0;width:auto;padding:0 12px;" readonly>
    <button id="pasteBtn" style="padding:0 16px;background:transparent;border:none;border-left:1px solid rgba(255,255,255,.08);color:#8c8782;font-size:12px;letter-spacing:.08em;flex-shrink:0;">Paste</button>
  </div>
  <!-- Hex keypad — shown when input is tapped -->
  <div id="hexKeypad" style="display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:100;background:#252422;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;box-shadow:0 8px 32px rgba(0,0,0,.6);">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;" id="keypadGrid"></div>
  </div>
</div>

<div style="width:100%;max-width:420px;" id="mainGrid">

  <div class="card">

    <div class="tabbar">
      <button class="tabbtn active" id="tabBtnWheel">Color Wheel</button>
      <button class="tabbtn" id="tabBtnLight">Light & Shadow</button>
    </div>

    <!-- ══════════ TAB: COLOR WHEEL ══════════ -->
    <div class="tabpanel active" id="tabWheel">

      <div class="row" style="display:flex;justify-content:center;padding:26px;position:relative;">
        <div style="position:relative;width:${CSS}px;height:${CSS}px;">
          <canvas id="wc" width="${PX}" height="${PX}" style="width:${CSS}px;height:${CSS}px;"></canvas>
          <div id="hueCursor" style="position:absolute;width:24px;height:24px;border-radius:7px;border:2px solid rgba(255,255,255,.92);box-shadow:0 1px 7px rgba(0,0,0,.5);pointer-events:none;transform:translate(-50%,-50%);"></div>
          <div id="refRingCursor" style="position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 1px 5px rgba(0,0,0,.5);pointer-events:none;transform:translate(-50%,-50%);"></div>
          <div id="svCursor" style="position:absolute;width:14px;height:14px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);"></div>
        </div>
      </div>

      <!-- Selected / Greyscale / Valeur Ref — 3 column -->
      <div class="row" style="display:grid;grid-template-columns:1fr 1fr 1fr;">
        <div id="selSwatch" style="padding:12px 14px;border-right:1px solid rgba(255,255,255,.08);min-height:68px;display:flex;flex-direction:column;justify-content:space-between;">
          <span class="lbl" id="selLbl">Selected</span>
          <span id="selHex" style="font-size:13px;letter-spacing:.05em;"></span>
        </div>
        <div id="graySwatch" style="padding:12px 14px;border-right:1px solid rgba(255,255,255,.08);min-height:68px;display:flex;flex-direction:column;justify-content:space-between;">
          <span class="lbl" id="grayLbl">Greyscale</span>
          <span id="grayL" style="font-size:13px;"></span>
        </div>
        <div id="refSwatch" style="padding:12px 14px;min-height:68px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;">
          <span class="lbl" id="refLbl">Valeur Ref</span>
          <span id="refHex" style="font-size:13px;"></span>
        </div>
      </div>

      <div class="row" style="display:grid;grid-template-columns:1fr 1fr 1fr;background:#2e2c29;">
        <div style="padding:10px 14px;border-right:1px solid rgba(255,255,255,.05);"><div class="lbl" style="margin-bottom:3px;">H</div><div id="hVal" style="font-size:16px;"></div></div>
        <div style="padding:10px 14px;border-right:1px solid rgba(255,255,255,.05);"><div class="lbl" style="margin-bottom:3px;">S</div><div id="sVal" style="font-size:16px;"></div></div>
        <div style="padding:10px 14px;"><div class="lbl" style="margin-bottom:3px;">V</div><div id="vVal" style="font-size:16px;"></div></div>
      </div>

      <div class="row" style="display:flex;justify-content:space-between;align-items:center;padding:12px 18px;">
        <div>
          <div class="lbl" style="margin-bottom:3px;">Iso-luminance Contours</div>
          <div style="font-size:11px;color:#6b6863;">Equal lightness lines on SV square</div>
        </div>

// ── Update UI ─────────────────────────────────────────────────────────────────
function updateUI(){
  const[r,g,b]=hsvToRgb(H,S,V),hex=rgbToHex(r,g,b),L=lum(r,g,b),gray=Math.round(L*255),c=ink(L);
  document.getElementById("selSwatch").style.background=hex;
  document.getElementById("selHex").textContent=hex.toUpperCase();
  document.getElementById("selHex").style.color=c;
  document.getElementById("selLbl").style.color=c;
  document.getElementById("graySwatch").style.background=`rgb(${gray},${gray},${gray})`;
  document.getElementById("grayL").textContent=`L ${Math.round(L*100)}%`;
  document.getElementById("grayL").style.color=c;
  document.getElementById("grayLbl").style.color=c;
  document.getElementById("hVal").textContent=Math.round(H)+"°";
  document.getElementById("sVal").textContent=Math.round(S*100)+"%";
  document.getElementById("vVal").textContent=Math.round(V*100)+"%";
  document.getElementById("barL").textContent=`L ${Math.round(L*100)}%`;
  document.getElementById("mainMark").style.left=(H/360*100)+"%";

  const vH=refHsv??[H,S,V];
  const[vr,vg,vb]=hsvToRgb(...vH),vhex=rgbToHex(vr,vg,vb),vL=lum(vr,vg,vb),vc=ink(vL);
  document.getElementById("refSwatch").style.background=vhex;
  document.getElementById("refHex").textContent=vhex.toUpperCase();
  document.getElementById("refHex").style.color=vc;
  document.getElementById("refLbl").style.color=vc;
  document.getElementById("refMark").style.left=(vH[0]/360*100)+"%";
  document.getElementById("rH").textContent=Math.round(vH[0])+"°";
  document.getElementById("rL").textContent=Math.round(vL*100)+"%";
  document.getElementById("rS").textContent=Math.round(vH[1]*100)+"%";
  document.getElementById("rV").textContent=Math.round(vH[2]*100)+"%";
  document.getElementById("barNote").style.display=refHsv?"block":"none";

  // cursors
  const {outerR,innerR,vInnerR,hOuterR}=getRingGeom();
  const rMid=(innerR+hOuterR)/2;  // hue ring midpoint
  const hRad=((H+180)*Math.PI)/180;
  // hue cursor on hue ring
  document.getElementById("hueCursor").style.left=(PX/2+rMid*Math.cos(hRad))/DPR+"px";
  document.getElementById("hueCursor").style.top =(PX/2+rMid*Math.sin(hRad))/DPR+"px";
  document.getElementById("hueCursor").style.background=rgbToHex(...hsvToRgb(H,1,1));
  // valeur ref cursor on valeur ring (outermost)
  const vMid=(vInnerR+outerR)/2;
  const refH=refHsv??[H,S,V];
  const vhRad=((refH[0]+180)*Math.PI)/180;
  const refRingCursor=document.getElementById("refRingCursor");
  refRingCursor.style.left=(PX/2+vMid*Math.cos(vhRad))/DPR+"px";
  refRingCursor.style.top =(PX/2+vMid*Math.sin(vhRad))/DPR+"px";
  refRingCursor.style.background=refHsv?rgbToHex(...hsvToRgb(...refH)):"transparent";
  refRingCursor.style.borderColor=refHsv?"rgba(255,255,255,.9)":"rgba(255,255,255,.35)";
  // SV cursor inside triangle
  const svPx=svToPixel(S,V,PX/2,PX/2,innerR);
  document.getElementById("svCursor").style.left=svPx.x/DPR+"px";
  document.getElementById("svCursor").style.top =svPx.y/DPR+"px";
  document.getElementById("svCursor").style.border=`2px solid ${L>0.45?"rgba(0,0,0,0.7)":"rgba(255,255,255,0.85)"}`;

  // Light & Shadow
  document.getElementById("baseSwatch").style.background=hex;
  document.getElementById("baseHex").textContent=hex.toUpperCase();
  document.getElementById("baseHDeg").textContent=`H ${Math.round(H)}°`;
  document.getElementById("baseLum").textContent=`L ${Math.round(L*100)}%`;

  // Temp dot: actual blackbody colour at current K
  const[kR,kG,kB]=kelvinToRgb(lightK);
  document.getElementById("tempDot").style.background=rgbToHex(kR,kG,kB);
  // Label with preset names and K value
  const kLabel = lightK<=1800?"Candlelight":lightK<=2700?"Incandescent":lightK<=3500?"Warm White":
                 lightK<=4500?"Daylight":lightK<=5500?"Noon Sun":lightK<=6500?"Overcast":
                 lightK<=8000?"Shade":"Clear Sky";
  document.getElementById("tempLbl").textContent=`${kLabel} · ${lightK}K`;

  // Gradient bar: blackbody colours across the full range 1000–12000K
  const tempStops=[];
  for(let k=1000;k<=12000;k+=500){
    const[r,g,b]=kelvinToRgb(k);tempStops.push(`rgb(${r},${g},${b})`);
  }
  document.getElementById("tempGrad").style.background=`linear-gradient(to right,${tempStops.join(",")})`;

  document.getElementById("strLbl").textContent=Math.round(lightStr*100)+"%";

  // Strength gradient: shadow → base → highlight using Kelvin hues
  const lhK = kelvinToHue(lightK);
  const shK = shadowKelvinHue(lightK);
  const hiV=Math.min(1,V+0.28),hiS=Math.max(0,S-S*0.7),hiH=blendH(H,lhK,0.35);
  const sdV=Math.max(0.02,V-0.30),sdS=Math.min(1,S*0.85),sdH=blendH(H,shK,0.35);
  document.getElementById("strGrad").style.background=`linear-gradient(to right,${rgbToHex(...hsvToRgb(sdH,sdS,sdV))},${hex},${rgbToHex(...hsvToRgb(hiH,hiS,hiV))})`;

  const satLow =rgbToHex(...hsvToRgb(H, Math.max(0,S-0.5), V));
  const satHigh=rgbToHex(...hsvToRgb(H, Math.min(1,S+0.4), V));
  document.getElementById("satGrad").style.background=`linear-gradient(to right,${satLow},${hex},${satHigh})`;
  document.getElementById("satLbl").textContent=satBias<-0.15?"Naturalistic":satBias>0.15?"Illustrative":"Balanced";
  updatePalette();
}

function updatePalette(){
  const pal=genPalette(H,S,V,lightK,lightStr,satBias);
  const pc=document.getElementById("palette");pc.innerHTML="";
  const gc=document.getElementById("grayCheck");gc.innerHTML="";

}

// ── Wheel interaction ─────────────────────────────────────────────────────────
let dragging=null;
const wc=document.getElementById("wc");
function getWheelPos(e){
  const rect=wc.getBoundingClientRect(),scale=wc.width/rect.width,cx=wc.width/2,cy=wc.height/2;
  const ex=e.touches?e.touches[0].clientX:e.clientX,ey=e.touches?e.touches[0].clientY:e.clientY;
  return{dx:(ex-rect.left)*scale-cx,dy:(ey-rect.top)*scale-cy};
}
// Recompute refHsv to match the new base luminance, keeping its hue angle
function reanchorRef(newH, newS, newV){
  const refAngle = refHsv ? refHsv[0] : newH;
  const L = lum(...hsvToRgb(newH, newS, newV));
  let lo=0, hi=1;
  for(let i=0;i<24;i++){
    const m=(lo+hi)/2;
    const[r,g,b]=hsvToRgb(refAngle,m,newV);
    if(lum(r,g,b)>L) lo=m; else hi=m;
  }
  refHsv=[refAngle,(lo+hi)/2,newV];
}

function hitTest(dx,dy){
  const dist=Math.sqrt(dx*dx+dy*dy);
  const {outerR,innerR,vInnerR,hOuterR}=getRingGeom();
  if(dist>=vInnerR && dist<=outerR+4) return "valeur";
  if(dist>=innerR  && dist<=hOuterR+4) return "ring";
  if(dist<innerR){
    const b=bary(dx+PX/2,dy+PX/2,...triVertices(PX/2,PX/2,innerR));
    if(inTri(b)) return "tri";
  }
  return null;
}
wc.addEventListener("mousedown",e=>{
  const{dx,dy}=getWheelPos(e);
  dragging=hitTest(dx,dy);
});
wc.addEventListener("touchstart",e=>{
  e.preventDefault();
  const{dx,dy}=getWheelPos(e);
  dragging=hitTest(dx,dy);
},{passive:false});
function onMove(e){
  if(!dragging)return;if(e.cancelable)e.preventDefault();
  const{dx,dy}=getWheelPos(e);
  const {innerR}=getRingGeom();
  if(dragging==="ring"){
    H=((Math.atan2(dy,dx)*180/Math.PI)+360+180)%360;
    reanchorRef(H,S,V);
  } else if(dragging==="valeur"){
    const newH=((Math.atan2(dy,dx)*180/Math.PI)+360+180)%360;
    const L=lum(...hsvToRgb(H,S,V));
    let lo=0,hi=1;
    for(let i=0;i<24;i++){const m=(lo+hi)/2;const[r,g,b]=hsvToRgb(newH,m,V);if(lum(r,g,b)>L)lo=m;else hi=m;}
    refHsv=[newH,(lo+hi)/2,V];
  } else {
    const [v0,v1,v2]=triVertices(PX/2,PX/2,innerR);
    let b=bary(dx+PX/2,dy+PX/2,v0,v1,v2);
    b={b0:Math.max(0,b.b0),b1:Math.max(0,b.b1),b2:Math.max(0,b.b2)};
    const t=b.b0+b.b1+b.b2||1;
    b={b0:b.b0/t,b1:b.b1/t,b2:b.b2/t};
    const sv=svFromBary(b);
    S=sv.s;V=sv.v;
    reanchorRef(H,S,V);
  }
  drawWheel(wc,H,S,V,contours,SURFACE);drawValeurBar(H,S,V);updateUI();
  clearTimeout(copyTimer);
  copyTimer=setTimeout(()=>{
    // Always copy the Valeur Ref hex (equal-value reference color)
    const vH=refHsv??[H,S,V];
    const[r,g,b]=hsvToRgb(...vH);
    const hex=rgbToHex(r,g,b);
    navigator.clipboard&&navigator.clipboard.writeText(hex.replace("#","")).catch(()=>{});
    document.getElementById("refHex").textContent="Copied ✓";
    setTimeout(()=>{ document.getElementById("refHex").textContent=hex.toUpperCase(); },1400);
  },500);
}
function onUp(){dragging=null;}
wc.addEventListener("mousemove",onMove);wc.addEventListener("mouseup",onUp);wc.addEventListener("mouseleave",onUp);
wc.addEventListener("touchmove",onMove,{passive:false});wc.addEventListener("touchend",onUp);

// ── Hex Keypad ────────────────────────────────────────────────────────────────
(function(){
  const keys = [
    '7','8','9','A',
    '4','5','6','B',
    '1','2','3','C',
    '0','D','E','F',
    '←','↵'   // last row: del spans 2, enter spans 2
  ];

  // Build grid
  const grid = document.getElementById('keypadGrid');

  // rows 0-3: 4 cols each
  const mainKeys = ['7','8','9','A','4','5','6','B','1','2','3','C','0','D','E','F'];
  mainKeys.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'kbtn';
    btn.textContent = k;
    btn.addEventListener('mousedown', e => { e.preventDefault(); handleKey(k); });
    btn.addEventListener('touchstart', e => { e.preventDefault(); handleKey(k); }, {passive:false});
    grid.appendChild(btn);
  });

  // bottom row: ← (2 cols) + ↵ (2 cols)
  const bottomRow = document.createElement('div');
  bottomRow.style.cssText = 'grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px;';

  const delBtn = document.createElement('button');
  delBtn.className = 'kbtn kdel';
  delBtn.textContent = '←';
  delBtn.addEventListener('mousedown', e => { e.preventDefault(); handleKey('←'); });
  delBtn.addEventListener('touchstart', e => { e.preventDefault(); handleKey('←'); }, {passive:false});

  const enterBtn = document.createElement('button');
  enterBtn.className = 'kbtn kenter';
  enterBtn.textContent = '↵';
  enterBtn.addEventListener('mousedown', e => { e.preventDefault(); handleKey('↵'); });
  enterBtn.addEventListener('touchstart', e => { e.preventDefault(); handleKey('↵'); }, {passive:false});

  bottomRow.appendChild(delBtn);
  bottomRow.appendChild(enterBtn);
  grid.appendChild(bottomRow);

  const keypad  = document.getElementById('hexKeypad');
  const hexInput = document.getElementById('hexInput');

  function handleKey(k){
    let val = hexInput.value;
    if(k === '←'){
      hexInput.value = val.slice(0, -1);
    } else if(k === '↵'){
      applyHexStr(hexInput.value);
      closeKeypad();
    } else {
      if(val.length < 6){
        hexInput.value = val + k;
        // live preview at 3 or 6 chars
        const v = hexInput.value;
        if(v.length === 3 || v.length === 6) applyHexStr(v);
      }
    }
    // update input border highlight
    const v = hexInput.value;
    document.getElementById('hexWrap').style.borderColor =
      (v.length === 3 || v.length === 6) ? 'rgba(204,120,92,.5)' : 'rgba(255,255,255,.08)';
  }

  function openKeypad(){
    keypad.style.display = 'block';
    document.getElementById('hexWrap').style.borderColor = 'rgba(204,120,92,.35)';
  }
  function closeKeypad(){
    keypad.style.display = 'none';
    document.getElementById('hexWrap').style.borderColor = 'rgba(255,255,255,.08)';
  }
  window.closeHexKeypad = closeKeypad;

  hexInput.addEventListener('click', e => { e.stopPropagation(); openKeypad(); });
  hexInput.addEventListener('touchend', e => { e.preventDefault(); openKeypad(); });
  document.addEventListener('click', e => {
    if(!keypad.contains(e.target) && e.target !== hexInput) closeKeypad();
  });
})();

// ── Hex input ─────────────────────────────────────────────────────────────────
function applyHexStr(raw){
  const rgb=parseHex(raw);if(!rgb)return false;
  [H,S,V]=rgbToHsv(...rgb);
  reanchorRef(H,S,V);
  drawWheel(wc,H,S,V,contours,SURFACE);drawValeurBar(H,S,V);updateUI();
  return true;
}
const hexInput=document.getElementById("hexInput");
hexInput.addEventListener("input",e=>{
  const v=e.target.value.replace(/[^0-9a-fA-F]/g,"").slice(0,6);e.target.value=v;
  if(v.length===3||v.length===6)applyHexStr(v);
});
hexInput.addEventListener("keydown",e=>{if(e.key==="Enter")applyHexStr(e.target.value);});
document.getElementById("pasteBtn").addEventListener("click",async()=>{
  try{const t=await navigator.clipboard.readText();const v=t.replace(/^#/,"").slice(0,6);hexInput.value=v;applyHexStr(v);}catch(e){}
});
window.addEventListener("paste",e=>{
  const t=e.clipboardData?.getData("text")??"";
  if(applyHexStr(t)){hexInput.value=t.replace(/^#/,"").slice(0,6);}
});

// ── Init ──────────────────────────────────────────────────────────────────────
drawWheel(wc,H,S,V,contours,SURFACE);
drawValeurBar(H,S,V);
updateUI();
</script>
</body>
</html>
